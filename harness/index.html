<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hjem-3d-card harness</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: sans-serif; }
  body.dark  { background: linear-gradient(160deg, #1f2a36, #121820); --primary-text-color: #eee; }
  body.light { background: linear-gradient(160deg, #f1efe9, #d9dde3); --primary-text-color: #222; }
  #wrap { max-width: 1300px; margin: 0 auto; padding-top: 16px; }
</style></head>
<body><div id="wrap"></div>
<script type="module">
  const glContexts = [];
  const origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, ...args) {
    const ctx = origGetContext.call(this, type, ...args);
    if (ctx && (type === 'webgl' || type === 'webgl2')) glContexts.push(ctx);
    return ctx;
  };

  import '../dist/hjem-3d-card.js';
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('bg') || 'dark';
  const getJson = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); return r.json(); };
  const houseParam = q.get('house');
  const house = houseParam === 'example' ? await getJson('../test/fixtures/example-house.json')
    : houseParam === 'private' ? await getJson('private/house.json')
    : await getJson('private/house.json').catch(() => getJson('../test/fixtures/example-house.json'));
  const wrap = document.getElementById('wrap');
  const roomIds = Object.keys(house.rooms || {});
  const rooms = Object.fromEntries(roomIds.map(id => [id, { light: `light.${id}` }]));
  const litParam = q.get('lit') === 'auto'
    ? [roomIds[0] && `${roomIds[0]}:255,146,39:255`, roomIds[1] && `${roomIds[1]}:80,140,255:128`].filter(Boolean).join(';')
    : (q.get('lit') || '');
  const lit = Object.fromEntries(litParam.split(';').filter(Boolean).map(s => {
    const [id, rgb, bri] = s.split(':');
    return [id, { rgb: rgb.split(',').map(Number), bri: Number(bri) }];
  }));
  const states = Object.fromEntries(roomIds.map(id => [`light.${id}`, lit[id]
    ? { entity_id: `light.${id}`, state: 'on', attributes: { rgb_color: lit[id].rgb, brightness: lit[id].bri } }
    : { entity_id: `light.${id}`, state: 'off', attributes: {} }]));
  states['input_select.mode'] = { entity_id: 'input_select.mode', state: q.get('mode') || 'Mørk', attributes: {} };
  const spots = Object.keys(house.parking || {});
  const carDefs = [
    { id: 'car1', model: 'model_y', color: '#2f5d8a', battery: '72' },
    { id: 'car2', model: 'model_3', color: '#8a8f96', battery: '55' },
  ].slice(0, spots.length);
  const cars = Object.fromEntries(carDefs.map((c, i) => [c.id, { spot: spots[i], model: c.model, color: c.color,
    tracker: `device_tracker.${c.id}`, cable: `binary_sensor.${c.id}_cable`, charging: `binary_sensor.${c.id}_charging`, battery: `sensor.${c.id}_battery` }]));
  const charge = q.get('charge') || 'charging';            // none | cable | charging (applies to car1)
  const away = q.get('car') === 'away';                    // car1 away
  for (const c of carDefs) {
    const first = c.id === 'car1';
    states[`device_tracker.${c.id}`] = { state: first && away ? 'not_home' : 'home', attributes: {} };
    states[`binary_sensor.${c.id}_cable`] = { state: first && charge !== 'none' ? 'on' : 'off', attributes: {} };
    states[`binary_sensor.${c.id}_charging`] = { state: first && charge === 'charging' ? 'on' : 'off', attributes: {} };
    states[`sensor.${c.id}_battery`] = { state: c.battery, attributes: {} };
  }
  states['light.charger_led'] = { state: 'on', attributes: { rgb_color: [0, 200, 80], brightness: 255 } };
  states['input_select.page'] = { state: 'hjem-3d', attributes: {} };
  const calls = [];
  const hass = { states, callService: async (d, s, data, target) => { calls.push(`${d}.${s}:${target?.entity_id}`); } };
  const card = document.createElement('hjem-3d-card');
  const config = { type: 'custom:hjem-3d-card', house, rooms, cars, charger: house.charger ? { led: 'light.charger_led' } : undefined, page_entity: 'input_select.page', mode_entity: 'input_select.mode', debug: q.has('debug'), height: q.get('height') || '700px', quality: q.get('quality') || 'high' };
  card.setConfig(config);
  card.hass = hass;              // Review Focus 5: hass arrives before the card is attached
  wrap.appendChild(card);
  window.__card = card;
  window.__calls = calls;
  if (q.has('leak')) {
    // Review Focus 1+2: re-config and remount many times; exactly one live view must remain.
    for (let i = 0; i < 20; i++) { card.setConfig({ ...config }); card.remove(); wrap.appendChild(card); }
  }
  if (q.has('t')) setTimeout(() => card.debugJump(Number(q.get('t'))), 300);
  const center = id => { const r = house.rooms[id].rects[0]; return [(r.x0 + r.x1) / 2, (r.z0 + r.z1) / 2]; };
  const tapId = q.get('tap') === 'auto' ? roomIds[0] : q.get('tap');
  const tapIdleId = q.get('tapidle') === 'auto' ? roomIds[0] : q.get('tapidle');
  if (tapId) setTimeout(() => card.debugTapAt(...center(tapId)), 500);         // needs t=1 (plan)
  if (tapIdleId) setTimeout(() => card.debugTapAt(...center(tapIdleId)), 500); // needs t=0 (idle)
  if (q.get('tap2') === 'auto' && roomIds.length >= 2) {
    setTimeout(() => {
      card.debugTapAt(...center(roomIds[0]));
      setTimeout(() => card.debugTapAt(...center(roomIds[1])), 50);
    }, 500);
  }
  if (q.get('tapwall') === 'auto' && house.walls && house.walls.length > 0) {
    const w = house.walls[0];
    const wh = w.h ?? (house.shell.wallHeight || 2.5);
    setTimeout(() => card.debugTapAt((w.x0 + w.x1) / 2, (w.z0 + w.z1) / 2, wh), 500);
  }
  const carCentre = id => { const p = house.parking[cars[id].spot]; const d = { west: [-1, 0], east: [1, 0], north: [0, -1], south: [0, 1] }[p.facing];
    return [p.x + d[0] * 2.3, p.z + d[1] * 2.3]; };
  if (q.get('tapcar') === 'auto' && cars.car1) setTimeout(() => card.debugTapAt(...carCentre('car1'), 0.8), 500);
  if (q.get('tapgrass') === 'auto') setTimeout(() => card.debugTapAt(house.plot.x1 - 1, house.plot.z1 - 1, 0.01), 500);
  if (q.get('stopcharge') === '1' && cars.car1) setTimeout(() => {
    card.hass = { ...hass, states: { ...hass.states, 'binary_sensor.car1_charging': { state: 'off', attributes: {} } } };
  }, 600);
  let framesDelta = 'n/a', flashes = 'n/a';
  if (q.has('churn')) setTimeout(() => {
    const f0 = window.hjem3dStats.frames;
    for (let i = 0; i < 100; i++) card.hass = { ...hass, states: { ...hass.states, 'sensor.churn': { state: String(i) } } };
    setTimeout(() => { framesDelta = String(window.hjem3dStats.frames - f0); }, 300);
  }, 900);
  setTimeout(() => {
    const liveGl = glContexts.filter(ctx => !ctx.isContextLost()).length;
    if (card.debugFlashes) flashes = card.debugFlashes().join(',') || 'none';
    document.title = `ready live=${window.hjem3dStats.liveViews} gl=${liveGl} calls=${calls.join(',') || 'none'} framesDelta=${framesDelta} flashes=${flashes} mode=${card.debugState()?.mode} flow=${card.debugState()?.flow} cable=${card.debugState()?.cable}`;
  }, 1400);
</script></body></html>
